    if(p.st.visible)p.st.rotation.z=Math.sin(time*BPM*Math.PI*2+p.ph)*0.6;});

  /* particles */
  let n=0;
  for(const q of parts){const u=(t-q.t0)/q.dur,end=q.t0+q.dur;const to=q.toP?TMP.set(q.toP.x,1.2,q.toP.z):q.to;
    if(prevT<end&&t>=end){if(q.hit==='ok'){q.toP.react=t;if(SND.on)sfx.ping();}else if(q.hit==='no'){spawnFx(TMP.set(q.toP.x,1.7,q.toP.z),t,1);if(SND.on)sfx.thud();}
      if(q.gold!==undefined&&SND.on)sfx.heart();}
    if(u<0||u>=1||n>=POOL)continue;bez(P,q.from,q.toP?TMP.set(q.toP.x,1.2,q.toP.z):q.to,q.h,u);dummy.position.copy(P);dummy.rotation.set(0,0,0);dummy.scale.setScalar(1);dummy.updateMatrix();partMesh.setMatrixAt(n,dummy.matrix);partMesh.setColorAt(n,q.c);n++;}
  for(let i=n;i<POOL;i++){dummy.scale.setScalar(0);dummy.updateMatrix();partMesh.setMatrixAt(i,dummy.matrix);}
  partMesh.instanceMatrix.needsUpdate=true;partMesh.instanceColor.needsUpdate=true;
  fx.forEach(f=>{const a=t-f.t0;const life=f.kind?0.9:1.3;if(a<0||a>life){f.s.visible=false;return;}f.s.visible=true;f.s.position.set(f.p.x+(f.kind?0:f.dx*a),f.p.y+(f.kind?a*0.4:a*1.6),f.p.z);f.s.material.opacity=1-a/life;f.s.scale.setScalar(f.kind?0.55:0.6);});

  prevT=t;
  if(!reduce&&now-lastInteract>4000&&pointers.size===0)theta+=dt*0.07;
  camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);renderer.render(scene,camera);placeTags(t);
  requestAnimationFrame(frame);
}

})();
