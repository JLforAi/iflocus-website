const lerpA=(a,b,k)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;};

const captions=['品牌在客戶門店辦活動，台灣啦啦隊到場應援','絡客思雲端平台鎖定門店周邊，把活動推播送到路人手機','路人走進現場聚集，直播與打卡同步擴散到線上','線上粉絲被導回門店，進店消費回到品牌'];
const capEl=document.getElementById('caption'),stepEls=[...document.querySelectorAll('.steps i')];let curStep=-1;
function setStep(s){if(s===curStep)return;curStep=s;capEl.textContent=captions[s];stepEls.forEach((e,i)=>e.classList.toggle('on',i<=s));if(s===3)sfx.swell();}

/* ================= camera ================= */
let theta=1.3,phi=1.1,radius=36;const target=new THREE.Vector3(-0.5,4,1.5);
const el=renderer.domElement;const pointers=new Map();let pinchD=0,lastInteract=-1e9;
if(!EMBED){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();});
  el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const pr=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(pointers.size===1){theta-=(e.clientX-pr.x)*0.008;phi=Math.min(1.42,Math.max(0.3,phi-(e.clientY-pr.y)*0.006));}
    else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD)radius=Math.min(80,Math.max(10,radius*pinchD/d));pinchD=d;}});
  const up=e=>{pointers.delete(e.pointerId);pinchD=0;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(80,Math.max(10,radius*(1+e.deltaY*0.001)));lastInteract=performance.now();},{passive:false});
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;const portrait=w/h<0.8;camera.fov=portrait?52:40;camera.updateProjectionMatrix();
  if(performance.now()-lastInteract>1e6){radius=portrait?37:33;}}
addEventListener('resize',resize);resize();

/* ================= labels ================= */
const M2=new THREE.Vector3();
const tags=[['tBrand',()=>M2.copy(brand.position).setY(10.5),0],['tStore',()=>M2.set(-6.4,6,-2),0],['tCheer',()=>M2.set(SX,4.5,SZ-1.2),0],
  ['tPush',()=>M2.set(9.5,12.6,1.5),0],['tCrowd',()=>M2.set(SX+4.2,2.3,SZ+4.6),S3-1],
  ['tSocial',()=>{let b=phones[0],by=-1e9;phones.forEach(p=>{const s=M2.copy(p.p).project(camera);if(s.z<1&&Math.abs(s.x)<.6&&s.y>by){by=s.y;b=p;}});return M2.copy(b.p).setY(b.p.y+1.4);},0]]
  .map(([id,f,from])=>({el:document.getElementById(id),p:f,from}));
function proj(v){const w=innerWidth,h=innerHeight;v.project(camera);return {x:(v.x+1)/2*w,y:(1-v.y)/2*h,ok:v.z<1&&Math.abs(v.x)<1.05&&v.y<0.92&&v.y>-1};}
function placeUI(t){tags.forEach(tg=>{const s=proj(tg.p());tg.el.style.opacity=(s.ok&&t>=tg.from)?1:0;tg.el.style.left=s.x+'px';tg.el.style.top=s.y+'px';});
  notis.forEach(n=>{const age=t-n.t0;const on=n.p&&age>=0&&age<2.4&&n.p.g.visible;n.d.classList.toggle('show',on);
    if(n.p){const s=proj(M2.set(n.p.x,1.9,n.p.z));n.d.style.left=s.x+'px';n.d.style.top=s.y+'px';}});}

/* ================= loop ================= */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let simT=0,last=performance.now(),lastBeat=-1;schedule();
document.getElementById('replay').addEventListener('click',()=>{track('omo_demo_replay');simT=0;prevT=0;curStep=-1;schedule();});
let visible=true;if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:0.05}).observe(document.body);}

function danceCheer(c,j,t,time,dt){
  const active=t>=c.lit;const beat=Math.max(0,(t-2.8)*BPM+j*0.08);const bi=Math.floor(beat),ph=beat-bi,hit=Math.sin(ph*Math.PI);
  let lt=[0.25,0.25],kick=[0,0],jump=0;
  if(active){const pat=Math.floor(beat/8)%3;
    if(pat===0){const up=bi%2===0;lt=up?[2.6,2.6]:[0.9,0.9];}
    else if(pat===1){lt=[2.85,2.85];jump=hit*0.32;}
    else{const s=bi%2;lt=s?[2.7,0.6]:[0.6,2.7];kick[s]=hit*1.1;}
  }else{lt=[0.22+Math.sin(time*2+j)*0.05,0.22+Math.sin(time*2+j+1)*0.05];}
  const k=Math.min(1,dt*14);
  c.lift[0]+=(lt[0]-c.lift[0])*k;c.lift[1]+=(lt[1]-c.lift[1])*k;c.kick[0]+=(kick[0]-c.kick[0])*k;c.kick[1]+=(kick[1]-c.kick[1])*k;
  c.arms[0].rotation.z=-c.lift[0];c.arms[1].rotation.z=c.lift[1];
  const shake=active?Math.sin(time*18)*0.12:0;c.arms[0].rotation.x=shake;c.arms[1].rotation.x=-shake;
  c.legs[0].rotation.x=-c.kick[0];c.legs[1].rotation.x=-c.kick[1];
  c.root.position.y=0.4+jump;c.head.rotation.z=active?Math.sin(beat*Math.PI)*0.12:0;c.head.rotation.x=active?-0.05:0.05;
  c.tails.forEach((tp,i)=>{tp.rotation.x=0.25+Math.sin(time*7+i)*0.15+jump*0.8;tp.rotation.z=Math.sin(time*5+i*2)*0.18;});
}

function frame(now){
  if(!visible||document.hidden){last=now;requestAnimationFrame(frame);return;}
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;simT+=dt;let t=simT;
  if(t>END+1.2){simT=0;t=0;prevT=0;curStep=-1;schedule();}
  setStep(t<S2?0:t<S3?1:t<S4?2:3);

  if(t>=2.8&&t<END-1){const beat=Math.floor((t-2.8)*BPM);if(beat!==lastBeat){lastBeat=beat;const m=beat%4;
    if(t<S4){if(m===0||m===1)sfx.kick();if(m===2)sfx.clap();}else if(m===0)sfx.kick();}}else lastBeat=-1;

  gem.rotation.y+=dt*0.8;brand.scale.setScalar(1+Math.min(0.4,returns*0.02)+Math.sin(time*3)*0.03);halo.scale.setScalar(1+((time*0.6)%1)*0.4);
  const sending=t>=S2&&t<S3;cloudBase.material.emissiveIntensity=sending?0.5+Math.sin(time*8)*0.3:0.05;lens.material.emissiveIntensity=sending?0.9:0.3;cloud.position.y=10.5+Math.sin(time*0.8)*0.15;
  bulbs.forEach((m,i)=>m.emissiveIntensity=t>=S3?0.5+0.5*Math.sin(time*4+i):0.05);
  glassMat.emissiveIntensity=t>S3?0.22:0;doorGlow.material.emissiveIntensity=t>S4?0.6+Math.sin(time*4)*0.2:0;
  balloons.forEach(b=>{b.b.position.x=Math.sin(time*1.2+b.ph)*0.06;b.g.rotation.z=Math.sin(time*0.9+b.ph)*0.04;});

  /* cloud push: target walkers inside the store area */
  const aOp=t>=S2&&t<S3+0.8?Math.min(1,(t-S2)*2)*(t>S3?Math.max(0,1-(t-S3)/0.8):1):0;area.material.opacity=0.1*aOp;areaEdge.material.opacity=(0.45+Math.sin(time*4)*0.15)*aOp;
  if(sending&&t>=nextPush){const cand=people.filter(p=>p.mode==='walk'&&p.eligible&&!p.targeted&&Math.hypot(p.x-AREA_C.x,p.z-AREA_C.z)<AREA_R-0.3);
    if(cand.length){const p=cand[Math.floor(Math.random()*cand.length)];p.targeted=true;parts.push({t0:t,dur:0.8,from:CLOUD_TX,tgtP:p,h:0.6,c:SKY,push:true});sfx.ping();}
    nextPush=t+0.22;}
  cheers.forEach((c,j)=>{danceCheer(c,j,t,time,dt);const k=t>=c.lit?Math.min(1,(t-c.lit)*2):0;pomGold.emissiveIntensity=pomWhite.emissiveIntensity=k*0.35;});

  /* people */
  people.forEach((p,i)=>{
    if(p.mode==='walk'){p.x+=p.vx*dt;p.face=p.vx>0?Math.PI/2:-Math.PI/2;p.moving=true;if(p.x>20)p.x=-20;if(p.x<-20)p.x=20;
}
    else if(p.mode==='notified'){p.moving=false;p.face=lerpA(p.face,Math.atan2(1.5-p.x,-0.8-p.z),Math.min(1,dt*5));if(t-p.nt>1.3){p.mode='toCrowd';}}
    else if(p.mode==='toCrowd'){if(moveTo(p,p.spot.x,p.spot.z,2.8,dt)){p.mode='crowd';p.phone.visible=false;p.stick.visible=true;sfx.pop();}}
    else if(p.mode==='crowd'){p.moving=false;p.face=lerpA(p.face,Math.atan2(SX-p.x,SZ-p.z),Math.min(1,dt*4));if(t>=p.enterAt){p.mode='toDoor';p.stick.visible=false;}}
    else if(p.mode==='hidden'){if(p.online&&t>=p.spawnAt&&p.spawnAt<1e8){p.mode='toDoor';p.x=p.sx;p.z=p.sz;p.g.visible=true;p.phone.visible=true;p.spawnAt=1e9;}}
    if(p.mode==='toDoor'){if(moveTo(p,DOOR.x+(i%3-1)*0.4,DOOR.z,2.6,dt)){p.mode='gone';p.g.visible=false;
      parts.push({t0:t,dur:1.1,from:new THREE.Vector3(DOOR.x,2,DOOR.z),to:brand.position,h:1.5,c:BLUE,ret:true});sfx.coin();}}
    if(!p.g.visible)return;
    const hop=p.mode==='crowd'&&t<S4+3?Math.max(0,Math.sin(time*BPM*Math.PI+p.ph))*0.28:0;
    p.g.position.set(p.x,hop,p.z);p.g.rotation.y=p.face;
    const sw=p.moving?Math.sin(time*9+p.ph)*0.6:0;p.legs[0].rotation.x=sw;p.legs[1].rotation.x=-sw;
    if(p.stick.visible)p.stick.rotation.z=Math.sin(time*BPM*Math.PI*2+p.ph)*0.6;
  });

  /* phones */
  phones.forEach((ph,i)=>{const k=t>=ph.lit?Math.min(1,(t-ph.lit)*2):0;
    dummy.position.set(ph.p.x,ph.p.y+Math.sin(time*1.4+i)*0.15,ph.p.z);dummy.lookAt(0,ph.p.y,24);dummy.scale.setScalar(1+k*0.2);dummy.updateMatrix();frameMesh.setMatrixAt(i,dummy.matrix);
    dummy.translateZ(0.045);dummy.updateMatrix();screenMesh.setMatrixAt(i,dummy.matrix);screenMesh.setColorAt(i,tmpC.set(0xCFD8E3).lerp(i%3?SKY:GOLD_L,k));});
  frameMesh.instanceMatrix.needsUpdate=true;screenMesh.instanceMatrix.needsUpdate=true;screenMesh.instanceColor.needsUpdate=true;
  hearts.forEach(h=>{const a=t-h.t0;if(a<0||a>1.4){h.s.visible=false;return;}h.s.visible=true;h.s.position.set(h.p.x+h.dx*a,h.p.y+0.8+a*1.6,h.p.z);h.s.material.opacity=1-a/1.4;h.s.scale.setScalar(0.5+Math.min(a*3,1)*0.4);});

  /* particles */
  let n=0;returns=0;
  for(const p of parts){const u=(t-p.t0)/p.dur,end=p.t0+p.dur;
    if(p.tgtP){p.to=p.to||new THREE.Vector3();p.to.set(p.tgtP.x,1.2,p.tgtP.z);}
    if(prevT<end&&t>=end){if(p.push){const q=p.tgtP;if(q.mode==='walk'){q.notified=true;q.mode='notified';q.nt=t;q.phone.visible=true;showNoti(q,t);sfx.push();}}if(p.snd==='chime')sfx.chime(p.i);else if(p.snd==='whoosh')sfx.whoosh();if(p.heart){spawnHeart(p.to,t);sfx.heart();}}
    if(p.ret&&u>=1)returns++;if(u<0||u>=1||n>=POOL)continue;
    bez(P,p.from,p.to,p.h,u);dummy.position.copy(P);dummy.rotation.set(0,0,0);dummy.scale.setScalar(u<.15?u/.15:u>.85?(1-u)/.15+.3:1);dummy.updateMatrix();
    partMesh.setMatrixAt(n,dummy.matrix);partMesh.setColorAt(n,p.c);n++;}
  for(let i=n;i<POOL;i++){dummy.scale.setScalar(0);dummy.updateMatrix();partMesh.setMatrixAt(i,dummy.matrix);}
  partMesh.instanceMatrix.needsUpdate=true;partMesh.instanceColor.needsUpdate=true;prevT=t;

  if(!reduce&&now-lastInteract>3500&&pointers.size===0)theta+=((1.3+Math.sin(time*0.12)*0.35)-theta)*Math.min(1,dt*0.8);
  camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);renderer.render(scene,camera);placeUI(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
