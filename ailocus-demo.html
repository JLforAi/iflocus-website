<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
if(EMBED)document.body.classList.add('embed');
const track=(name)=>{try{if(window.gtag)gtag('event',name,{event_category:'ailocus_demo',embed:EMBED?'1':'0'});}catch(e){}};
(function(){const f=document.getElementById('full');const u=new URL(location.href);u.searchParams.delete('embed');f.href=u.pathname+(u.search||'');f.addEventListener('click',()=>track('ailocus_demo_fullscreen'));})();
if(!window.THREE){document.getElementById('err').style.display='flex';return;}

/* ---------- sound (synthesized, no files) ---------- */
const SND={ctx:null,on:false,last:{}};
function audioInit(){if(SND.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SND.ctx=c;
  SND.master=c.createGain();SND.master.gain.value=0;const comp=c.createDynamicsCompressor();SND.master.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate*2;SND.noise=c.createBuffer(1,len,c.sampleRate);const d=SND.noise.getChannelData(0);let b=0;for(let i=0;i<len;i++){b=0.97*b+0.03*(Math.random()*2-1);d[i]=b*4;}
  /* ambient pad */
  SND.padF=c.createBiquadFilter();SND.padF.type='lowpass';SND.padF.frequency.value=900;SND.padG=c.createGain();SND.padG.gain.value=0.05;SND.padF.connect(SND.padG);SND.padG.connect(SND.master);
  SND.pad=[0,1,2].map(i=>{const o=c.createOscillator();o.type=i===0?'sine':'triangle';o.frequency.value=[261.6,329.6,392][i];const g=c.createGain();g.gain.value=i===0?0.5:0.22;o.connect(g);g.connect(SND.padF);o.start();return o;});
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=0.08;lg.gain.value=180;lfo.connect(lg);lg.connect(SND.padF.frequency);lfo.start();
  /* city bustle */
  const src=c.createBufferSource();src.buffer=SND.noise;src.loop=true;SND.busF=c.createBiquadFilter();SND.busF.type='bandpass';SND.busF.frequency.value=650;SND.busF.Q.value=0.7;
  SND.busG=c.createGain();SND.busG.gain.value=0;src.connect(SND.busF);SND.busF.connect(SND.busG);SND.busG.connect(SND.master);src.start();}
function gate(k,ms){const n=performance.now();if(SND.last[k]&&n-SND.last[k]<ms)return false;SND.last[k]=n;return true;}
function tone(f,dur,type,vol,when){if(!SND.on)return;const c=SND.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+0.05);}
const sfx={
  click(){tone(1400,0.05,'square',0.03);},
  tick(){if(gate('tick',45))tone(2100,0.04,'sine',0.05);},
  blip(n){if(!gate('blip',160))return;const f=[523.25,659.25,783.99,880,587.33][n%5];tone(f,0.35,'sine',0.1);tone(f*1.5,0.3,'sine',0.05,0.07);},
  pin(n){if(!gate('pin',200))return;const b=[659.25,523.25,783.99,587.33,698.46][n%5];[0,1,2].forEach(i=>tone(b*[1,1.25,1.5][i],0.4,'triangle',0.07,i*0.07));},
  dawn(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,1.2,'sine',0.06,i*0.12));},
  dusk(){[392,329.6,261.6].forEach((f,i)=>tone(f,1.5,'triangle',0.06,i*0.16));}
};
function audioUpdate(day,moving){if(!SND.on||!SND.ctx)return;const c=SND.ctx,t=c.currentTime;
  const F=[[261.6,329.6,392],[220,261.6,329.6]];for(let i=0;i<3;i++)SND.pad[i].frequency.setTargetAtTime(F[0][i]*day+F[1][i]*(1-day),t,0.8);
  SND.padF.frequency.setTargetAtTime(500+day*700,t,0.8);SND.busG.gain.setTargetAtTime(0.012+moving*0.11,t,0.4);SND.busF.frequency.setTargetAtTime(500+moving*500,t,0.5);}
const sndBtn=document.getElementById('sound');
sndBtn.addEventListener('click',()=>{audioInit();if(!SND.ctx){sndBtn.textContent='不支援音效';return;}
  if(SND.ctx.state==='suspended')SND.ctx.resume();SND.on=!SND.on;sndBtn.setAttribute('aria-pressed',SND.on);sndBtn.textContent=SND.on?'關閉音效':'開啟音效';
  SND.master.gain.setTargetAtTime(SND.on?0.6:0,SND.ctx.currentTime,0.15);if(SND.on){sfx.dawn();track('ailocus_demo_sound_on');}});

/* ---------- renderer ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,0.1,400);
let DAY_BG=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()||'#F7F1F9');
const NIGHT_BG=new THREE.Color(0x221129);
scene.background=DAY_BG.clone();scene.fog=new THREE.Fog(DAY_BG.clone(),70,130);

let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const grad=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const toon=(c,o)=>new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},o||{}));
function mergeGeo(parts){const pos=[],nor=[];parts.forEach(([g,m])=>{const n=g.index?g.toNonIndexed():g.clone();n.applyMatrix4(m);n.computeVertexNormals();pos.push(...n.attributes.position.array);nor.push(...n.attributes.normal.array);});
  const b=new THREE.BufferGeometry();b.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));b.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));return b;}

const hemi=new THREE.HemisphereLight(0xfff6fb,0xd8c8df,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e8,0.6);sun.position.set(-14,26,16);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:80});sun.shadow.bias=-0.0006;scene.add(sun);

/* ---------- city ---------- */
const buckets={};const winParts=[],lanternParts=[];
const M4=(x,y,z,ry,sx,sy,sz)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,ry||0,0)),new THREE.Vector3(sx||1,sy||1,sz||1));
function add(geo,m,c){(buckets[c]=buckets[c]||[]).push([geo,m]);}
const BOX=new THREE.BoxGeometry(1,1,1),ROOF=new THREE.ConeGeometry(0.72,0.6,4),SPH=new THREE.SphereGeometry(0.5,12,10),CYL=new THREE.CylinderGeometry(0.5,0.5,1,10);
function box(w,h,d,x,y,z,c){add(BOX,M4(x,y+h/2,z,0,w,h,d),c);}
const W=4.8;
const ZMAP=[['res','res','off','off'],['res','res','off','off'],['nm','com','com','com'],['nm','nm','park','com']];
const BC=[-9,-3,3,9];const blocks=[];
const BASE={res:0xFBF7FC,off:0xF3F0F8,com:0xFFF7EE,nm:0xFFF1E6,park:0xD7EDC9};
/* base slab & roads */
const slab=new THREE.Mesh(new THREE.BoxGeometry(26,0.7,26),toon(0xE3D8E8));slab.position.y=-0.35;slab.receiveShadow=true;scene.add(slab);
const road=new THREE.Mesh(new THREE.PlaneGeometry(25.4,25.4),toon(0xD6CADD));road.rotation.x=-Math.PI/2;road.position.y=0.005;road.receiveShadow=true;scene.add(road);
const roadMat=road.material;
for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const type=ZMAP[r][c],x=BC[c],z=BC[r];blocks.push({type,x,z});
  box(W,0.1,W,x,0,z,BASE[type]);
  if(type==='res'){
    [[-1.2,-1.2],[1.2,-1.2],[-1.2,1.2],[1.2,1.2]].forEach(([dx,dz],i)=>{
      if((r+c+i)%4===0){const h=3+rnd()*1.2;box(1.9,h,1.9,x+dx,0.1,z+dz,[0xF1E6F4,0xFFF4E8][i%2]);
        for(let k=0.8;k<h-0.2;k+=0.75)winParts.push([BOX,M4(x+dx,0.1+k,z+dz,0,1.96,0.2,1.96)]);
        box(2.05,0.18,2.05,x+dx,0.1+h,z+dz,0xC18DCE);}
      else{const h=1.1+rnd()*0.8;box(1.6,h,1.6,x+dx,0.1,z+dz,[0xFFF8F0,0xF4E9DD,0xEDE3F2][(i+r)%3]);
        add(ROOF,M4(x+dx,0.1+h+0.3,z+dz,Math.PI/4,1.6,1,1.6),[0xC18DCE,0xB0725A,0x8E9BB5][(i+c)%3]);
        winParts.push([BOX,M4(x+dx,0.1+h*0.55,z+dz,0,1.66,0.26,0.5)]);}
    });
  }else if(type==='off'){
    [[-1.1,-0.9,2.1],[1.2,1.0,1.8]].forEach(([dx,dz,s],i)=>{const h=4+rnd()*3.2;
      box(s,h,s,x+dx,0.1,z+dz,[0xDDE3EE,0xE8E0F0,0xCFD8E3][(r+c+i)%3]);
      for(let k=0.7;k<h-0.3;k+=0.62)winParts.push([BOX,M4(x+dx,0.1+k,z+dz,0,s+0.06,0.22,s+0.06)]);
      box(s*0.7,0.35,s*0.7,x+dx,0.1+h,z+dz,0x7E3D8E);});
  }else if(type==='com'){
    [[-1.3,-1.2],[1.3,-1.2],[-1.3,1.25],[1.3,1.25]].forEach(([dx,dz],i)=>{if((r*3+c+i)%5===4)return;const h=2+rnd()*1.8;
      box(2,h,1.9,x+dx,0.1,z+dz,[0xFFE9D6,0xF9D9E3,0xE9F2FF,0xFFF4C9][(i+c)%4]);
      box(2.1,0.16,0.55,x+dx,0.95,z+dz+(dz>0?1.1:-1.1),[0xED9E33,0x7E3D8E,0x44A9DE,0xD4252F][(i+r+c)%4]);
      winParts.push([BOX,M4(x+dx,0.1+h*0.7,z+dz,0,2.05,0.3,1.95)]);});
  }else if(type==='nm'){
    for(let row=-1;row<=1;row+=2)for(let k=0;k<4;k++){const sx=x-1.65+k*1.1,sz=z+row*1.1;
      box(0.8,0.55,0.8,sx,0.1,sz,0xF4E6D6);box(1.0,0.08,1.0,sx,0.75,sz,[0xD4252F,0xED9E33,0xFFFFFF,0x7E3D8E][(k+row+r)%4]);
      lanternParts.push([SPH,M4(sx,1.25,sz+row*0.45,0,0.26,0.3,0.26)]);}
  }else if(type==='park'){
    const pond=new THREE.Mesh(new THREE.CircleGeometry(1.1,24),toon(0x9FD3EE));pond.rotation.x=-Math.PI/2;pond.position.set(x+0.8,0.12,z+0.6);scene.add(pond);
    [[-1.5,-1.4],[-0.2,-1.6],[1.5,-1.3],[-1.6,0.2],[-1.4,1.5],[0.1,1.7],[1.8,-0.2]].forEach(([dx,dz],i)=>{
      add(CYL,M4(x+dx,0.45,z+dz,0,0.16,0.7,0.16),0x8a6040);add(SPH,M4(x+dx,1.1,z+dz,0,1+(i%3)*0.18,1+(i%3)*0.18,1+(i%3)*0.18),[0x7cbf6a,0x8fcc72,0x6fae5c][i%3]);});
  }
}
/* transit hub */
box(2.6,1.1,2.6,0,0,0,0xFFFFFF);box(2.8,0.2,2.8,0,1.1,0,0x7E3D8E);box(2.62,0.2,2.62,0,0.55,0,0xC18DCE);
Object.entries(buckets).forEach(([c,parts])=>{const m=new THREE.Mesh(mergeGeo(parts),toon(+c));m.castShadow=true;m.receiveShadow=true;scene.add(m);});
const winMat=toon(0xD9E2F4,{emissive:new THREE.Color(0xFFD27A),emissiveIntensity:0});
const winMesh=new THREE.Mesh(mergeGeo(winParts),winMat);scene.add(winMesh);
const lanMat=toon(0xE8483F,{emissive:new THREE.Color(0xFF7A3D),emissiveIntensity:0});
scene.add(new THREE.Mesh(mergeGeo(lanternParts),lanMat));

/* ---------- agents & schedules ---------- */
const ROADS=[-12,-6,0,6,12];
const nearestRoad=v=>ROADS.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
function pointIn(type){const bs=blocks.filter(b=>b.type===type);const b=bs[Math.floor(rnd()*bs.length)];
  const side=Math.floor(rnd()*4),t=rnd()*4.2-2.1;const e=2.55;
  return side===0?{x:b.x+t,z:b.z-e}:side===1?{x:b.x+t,z:b.z+e}:side===2?{x:b.x-e,z:b.z+t}:{x:b.x+e,z:b.z+t};}
function route(A,B){const ra=nearestRoad(A.x),rb=nearestRoad(B.x);
  const pts=[A,{x:ra,z:A.z},{x:ra,z:0},{x:0,z:0},{x:rb,z:0},{x:rb,z:B.z},B];
  const out=[pts[0]];for(let i=1;i<pts.length;i++){const p=pts[i],q=out[out.length-1];if(Math.hypot(p.x-q.x,p.z-q.z)>0.01)out.push(p);}
  const L=[0];for(let i=1;i<out.length;i++)L.push(L[i-1]+Math.hypot(out[i].x-out[i-1].x,out[i].z-out[i-1].z));return {pts:out,L};}
const SEGCOL=[new THREE.Color(0x7E3D8E),new THREE.Color(0x1F8FFF),new THREE.Color(0xED9E33)];
const N=240;const agents=[];
for(let i=0;i<N;i++){
  const seg=i<N*0.55?0:i<N*0.8?1:2;const o=rnd()*0.9-0.45;
  const P={home:pointIn('res'),work:pointIn('off'),com:pointIn('com'),com2:pointIn('com'),nm:pointIn('nm'),park:pointIn('park')};
  const eve=rnd();let k;
  if(seg===0)k=[[0,'home'],[7.2,'home'],[8.7,'work'],[11.9,'work'],[12.4,'com'],[13.1,'com'],[13.6,'work'],[17.9,'work'],[18.9,eve<.35?'com2':eve<.6?'nm':'home'],[21.4,eve<.35?'com2':eve<.6?'nm':'home'],[22.3,'home']];
  else if(seg===1)k=[[0,'home'],[8.3,'home'],[9.3,'com'],[15.8,'com'],[16.4,'park'],[17.6,'park'],[18.4,eve<.6?'nm':'com2'],[22.2,eve<.6?'nm':'com2'],[23.1,'home']];
  else k=[[0,'home'],[9.6,'home'],[10.4,'com'],[12.4,'com'],[13.2,'home'],[14.9,'home'],[15.6,'park'],[17,'park'],[17.8,'home'],[18.9,'home'],[19.6,eve<.5?'nm':'home'],[21,eve<.5?'nm':'home'],[21.7,'home']];
  k=k.map(([h,p],j)=>[j===0?0:Math.min(23.9,h+o),p]);k.push([24,'home']);
  const legs=[];for(let j=0;j<k.length-1;j++)legs.push(k[j][1]!==k[j+1][1]?route(P[k[j][1]],P[k[j+1][1]]):null);
  agents.push({seg,P,k,legs,ph:rnd()*6.28});
}
function agentPos(a,h,out){h=((h%24)+24)%24;const k=a.k;let j=0;while(j<k.length-2&&h>=k[j+1][0])j++;
  const leg=a.legs[j];
  if(!leg){const p=a.P[k[j][1]];out.x=p.x;out.z=p.z;out.m=false;return out;}
  const u=(h-k[j][0])/(k[j+1][0]-k[j][0]);const d=u*leg.L[leg.L.length-1];let s=1;while(s<leg.L.length-1&&leg.L[s]<d)s++;
  const f=(d-leg.L[s-1])/Math.max(1e-6,leg.L[s]-leg.L[s-1]);out.x=leg.pts[s-1].x+(leg.pts[s].x-leg.pts[s-1].x)*f;out.z=leg.pts[s-1].z+(leg.pts[s].z-leg.pts[s-1].z)*f;out.m=true;return out;}

/* dots + trails */
const GH=5;const TOT=N*(GH+1);
const dc=document.createElement('canvas');dc.width=dc.height=64;const dx=dc.getContext('2d');const gr=dx.createRadialGradient(32,32,0,32,32,30);
gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.55,'rgba(255,255,255,1)');gr.addColorStop(0.75,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');dx.fillStyle=gr;dx.fillRect(0,0,64,64);
const dotTex=new THREE.CanvasTexture(dc);
const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(TOT*3),pCol=new Float32Array(TOT*3);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.8,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,alphaTest:0.05});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;scene.add(points);

/* heat */
const G=16,CS=1.5;const heat=new Float32Array(G*G),heatT=new Float32Array(G*G),cnt=new Float32Array(G*G);
const pillarMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,depthWrite:false});
const pillars=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.4,0.4,1,14),pillarMat,G*G);scene.add(pillars);
const tileMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,depthWrite:false});
const tileGeo=new THREE.PlaneGeometry(CS*0.96,CS*0.96);tileGeo.rotateX(-Math.PI/2);
const tiles=new THREE.InstancedMesh(tileGeo,tileMat,G*G);scene.add(tiles);
const dummy=new THREE.Object3D(),tc=new THREE.Color();
const H0=new THREE.Color(0xC18DCE),H1=new THREE.Color(0x7E3D8E),H2=new THREE.Color(0xED9E33);
function heatColor(v,o){if(v<0.55)o.copy(H0).lerp(H1,v/0.55);else o.copy(H1).lerp(H2,Math.min(1,(v-0.55)/0.45));return o;}
for(let i=0;i<G*G;i++){dummy.scale.setScalar(0);dummy.updateMatrix();pillars.setMatrixAt(i,dummy.matrix);tiles.setMatrixAt(i,dummy.matrix);pillars.setColorAt(i,H0);tiles.setColorAt(i,H0);}

/* zone cells for sound events */
const ZONES=['res','off','com','nm','park'];const zoneCells=ZONES.map(()=>[]);
for(let i=0;i<G*G;i++){const x=-12+(i%G+0.5)*CS,z=-12+(Math.floor(i/G)+0.5)*CS;const b=blocks.find(b=>Math.abs(b.x-x)<2.4&&Math.abs(b.z-z)<2.4);if(b)zoneCells[ZONES.indexOf(b.type)].push(i);}
const zoneHot=ZONES.map(()=>false);let prevHour=null;
/* interest pins (learned data) */
function emojiTex(e){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();x.arc(64,58,50,0,Math.PI*2);x.fill();
  x.beginPath();x.moveTo(48,100);x.lineTo(64,124);x.lineTo(80,100);x.fill();x.lineWidth=6;x.strokeStyle='#7E3D8E';x.beginPath();x.arc(64,58,50,0,Math.PI*2);x.stroke();
  x.font='58px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,62);return new THREE.CanvasTexture(c);}
const pins=[['☕',3,5,3,7.2,9.6],['🍜',-3,5,3,11.4,13.8],['🛍️',9,5,5,17.8,21.6],['🏮',-9,3.2,9,18.2,23.2],['🌳',3,3.6,9,15.2,17.8]].map(([e,x,y,z,a,b])=>{
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(e),transparent:true,depthWrite:false}));s.position.set(x,y,z);s.scale.setScalar(0);scene.add(s);return {s,a,b,y,k:0};});

/* labels */
const labelsEl=document.getElementById('labels');
const ZL=[['住宅區',-6,3.8,-6],['辦公區',6,10.8,-6],['商圈',3,4.6,4.5],['夜市',-9,2.2,6.2],['公園',3,2.4,11.2],['轉運站',0,2.2,0,'hub']].map(([t,x,y,z,c])=>{
  const d=document.createElement('div');d.className='tag'+(c?' '+c:'');d.textContent=t;labelsEl.appendChild(d);return {d,v:new THREE.Vector3(x,y,z)};});
const V=new THREE.Vector3();
function placeTags(){const w=innerWidth,h=innerHeight;ZL.forEach(l=>{V.copy(l.v).project(camera);const ok=V.z<1&&Math.abs(V.x)<1.05&&V.y<0.95&&V.y>-0.55;
  l.d.style.opacity=ok?1:0;l.d.style.left=((V.x+1)/2*w)+'px';l.d.style.top=((1-V.y)/2*h)+'px';});}

/* ---------- UI ---------- */
const slider=document.getElementById('slider'),clock=document.getElementById('clock'),cap=document.getElementById('caption'),playBtn=document.getElementById('play');
let hour=8,playing=true,show={heat:true,trail:true,seg:false},scrubTracked=false;
const CAPS=[[6,'深夜，人流集中在住宅區'],[7.3,'清晨，住宅區開始活動'],[9.4,'早上通勤，人流經轉運站移向辦公區'],[11.4,'上午，辦公區熱度升高'],[13.6,'午餐時段，辦公人流湧入商圈'],[17.6,'下午，辦公區維持熱度，家庭客走向公園'],[19.4,'下班時段，人流分流到商圈、夜市與住宅區'],[22.4,'夜間，商圈與夜市成為熱點'],[24.01,'深夜，人流回到住宅區']];
let lastCap='';
function setPlay(p){playing=p;playBtn.textContent=p?'❚❚':'▶';playBtn.setAttribute('aria-label',p?'暫停':'播放');}
playBtn.addEventListener('click',()=>{sfx.click();setPlay(!playing);if(playing)track('ailocus_demo_play');});
slider.addEventListener('input',()=>{if(Math.floor(+slider.value)!==Math.floor(hour))sfx.tick();hour=+slider.value;setPlay(false);if(!scrubTracked){scrubTracked=true;track('ailocus_demo_scrub');}});
function chip(id,key){const b=document.getElementById(id);b.addEventListener('click',()=>{sfx.click();show[key]=!show[key];b.setAttribute('aria-pressed',show[key]);
  if(key==='seg')document.getElementById('legend').classList.toggle('on',show.seg);track('ailocus_demo_toggle_'+key);});}
chip('cHeat','heat');chip('cTrail','trail');chip('cSeg','seg');

/* ---------- camera ---------- */
let theta=1.05,phi=0.92,radius=36;const target=new THREE.Vector3(0,0.5,1.5);
const el=renderer.domElement;const pointers=new Map();let pinchD=0,lastInteract=-1e9;
if(!EMBED){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();});
  el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const pr=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(pointers.size===1){theta-=(e.clientX-pr.x)*0.008;phi=Math.min(1.35,Math.max(0.25,phi-(e.clientY-pr.y)*0.006));}
    else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD)radius=Math.min(80,Math.max(12,radius*pinchD/d));pinchD=d;}});
  const up=e=>{pointers.delete(e.pointerId);pinchD=0;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(80,Math.max(12,radius*(1+e.deltaY*0.001)));lastInteract=performance.now();},{passive:false});
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;const portrait=w/h<0.8;camera.fov=portrait?55:40;camera.updateProjectionMatrix();
  if(performance.now()-lastInteract>1e6){radius=portrait?58:(EMBED?38:40);target.set(0,portrait?-2.2:-1.2,portrait?2.5:2.5);}}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let visible=true;if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:0.05}).observe(document.body);}
let last=performance.now();const tmp={x:0,z:0,m:false};const PURPLE=new THREE.Color(0x7E3D8E),bgNow=new THREE.Color(),roadDay=new THREE.Color(0xD6CADD),roadNight=new THREE.Color(0x4a3556);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function frame(now){
  if(!visible||document.hidden){if(SND.ctx&&SND.ctx.state==='running')SND.ctx.suspend();last=now;requestAnimationFrame(frame);return;}
  if(SND.on&&SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
  if(playing){hour=(hour+dt*24/42)%24;slider.value=hour.toFixed(2);}
  const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60/15)*15;clock.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const c=CAPS.find(c=>hour<c[0])[1];if(c!==lastCap){lastCap=c;cap.textContent=c;}

  /* day / night */
  const day=ss(5.2,7.2,hour)-ss(17.8,19.6,hour);const night=1-day;
  bgNow.copy(DAY_BG).lerp(NIGHT_BG,night*0.85);scene.background.copy(bgNow);scene.fog.color.copy(bgNow);
  hemi.intensity=0.3+0.25*day;sun.intensity=0.2+0.42*day;roadMat.color.copy(roadDay).lerp(roadNight,night*0.7);
  winMat.emissiveIntensity=night*0.9;lanMat.emissiveIntensity=0.3+night*1.2;

  /* agents */
  cnt.fill(0);const bgc=bgNow;
  for(let i=0;i<N;i++){const a=agents[i];agentPos(a,hour,tmp);
    const wob=tmp.m?0:0.18;const x=tmp.x+Math.sin(time*0.9+a.ph)*wob,z=tmp.z+Math.cos(time*0.7+a.ph)*wob;
    pPos[i*3]=x;pPos[i*3+1]=0.45;pPos[i*3+2]=z;
    const col=show.seg?SEGCOL[a.seg]:PURPLE;pCol[i*3]=col.r;pCol[i*3+1]=col.g;pCol[i*3+2]=col.b;
    const gx=Math.floor((x+12)/CS),gz=Math.floor((z+12)/CS);if(gx>=0&&gx<G&&gz>=0&&gz<G)cnt[gz*G+gx]+=1;
    for(let g=1;g<=GH;g++){const o=(N+(i*GH)+(g-1))*3;
      if(show.trail&&tmp.m){agentPos(a,hour-g*0.045,tmp);pPos[o]=tmp.x;pPos[o+1]=0.42;pPos[o+2]=tmp.z;tc.copy(col).lerp(bgc,0.25+g*0.13);pCol[o]=tc.r;pCol[o+1]=tc.g;pCol[o+2]=tc.b;agentPos(a,hour,tmp);}
      else{pPos[o]=x;pPos[o+1]=0.45;pPos[o+2]=z;pCol[o]=col.r;pCol[o+1]=col.g;pCol[o+2]=col.b;}}
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
  

  /* heat grid */
  for(let z=0;z<G;z++)for(let x=0;x<G;x++){let s=0,w=0;for(let dz=-1;dz<=1;dz++)for(let dx2=-1;dx2<=1;dx2++){const X=x+dx2,Z=z+dz;if(X<0||Z<0||X>=G||Z>=G)continue;const k=(dx2===0&&dz===0)?1:0.5;s+=cnt[Z*G+X]*k;w+=k;}
    heatT[z*G+x]=Math.min(1,s/w*0.24);}
  const kk=Math.min(1,dt*4);
  for(let i=0;i<G*G;i++){heat[i]+=(heatT[i]-heat[i])*kk;const v=heat[i];const x=-12+(i%G+0.5)*CS,z=-12+(Math.floor(i/G)+0.5)*CS;
    if(!show.heat||v<0.13){dummy.scale.setScalar(0);dummy.position.set(x,0,z);dummy.updateMatrix();pillars.setMatrixAt(i,dummy.matrix);tiles.setMatrixAt(i,dummy.matrix);continue;}
    const hgt=0.2+v*v*6;dummy.position.set(x,hgt/2+0.1,z);dummy.scale.set(0.3+v*0.5,hgt,0.3+v*0.5);dummy.updateMatrix();pillars.setMatrixAt(i,dummy.matrix);pillars.setColorAt(i,heatColor(v,tc));
    dummy.position.set(x,0.16,z);dummy.scale.set(1,1,1);dummy.updateMatrix();tiles.setMatrixAt(i,dummy.matrix);tiles.setColorAt(i,heatColor(v,tc));}
  pillars.instanceMatrix.needsUpdate=true;pillars.instanceColor.needsUpdate=true;tiles.instanceMatrix.needsUpdate=true;tiles.instanceColor.needsUpdate=true;

  /* sound: moving share, zone hot spots, dawn/dusk */
  if(SND.on){let mv=0;for(let i=0;i<N;i+=4){agentPos(agents[i],hour,tmp);if(tmp.m)mv++;}const moving=Math.min(1,mv/(N/4)*2.2);audioUpdate(day,moving);
    ZONES.forEach((z,zi)=>{const cells=zoneCells[zi];let s2=0;cells.forEach(i=>s2+=heat[i]);const a=cells.length?s2/cells.length:0;
      if(!zoneHot[zi]&&a>0.34){zoneHot[zi]=true;sfx.blip(zi);}else if(zoneHot[zi]&&a<0.24)zoneHot[zi]=false;});
    if(prevHour!==null&&playing){const cross=(t)=>prevHour<t&&hour>=t;if(cross(6.2))sfx.dawn();if(cross(18.8))sfx.dusk();}}
  prevHour=hour;
  /* interest pins */
  pins.forEach((p,pi)=>{const on=hour>=p.a&&hour<p.b?1:0;if(on&&p.k<0.1&&!p.was){sfx.pin(pi);}p.was=on===1;p.k+=(on-p.k)*Math.min(1,dt*5);p.s.scale.setScalar(p.k*1.6);p.s.position.y=p.y+Math.sin(time*2.2+p.a)*0.2;});

  if(!reduce&&now-lastInteract>4000&&pointers.size===0)theta+=((1.05+Math.sin(time*0.1)*0.4)-theta)*Math.min(1,dt*0.6);
  camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);renderer.render(scene,camera);placeTags();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
