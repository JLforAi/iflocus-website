<script>
(function(){

const NIGHT_BG=new THREE.Color(0x221129);
scene.background=DAY_BG.clone();scene.fog=new THREE.Fog(DAY_BG.clone(),70,130);

let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const grad=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);

function mergeGeo(parts){const pos=[],nor=[];parts.forEach(([g,m])=>{const n=g.index?g.toNonIndexed():g.clone();n.applyMatrix4(m);n.computeVertexNormals();pos.push(...n.attributes.position.array);nor.push(...n.attributes.normal.array);});
  const b=new THREE.BufferGeometry();b.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));b.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));return b;}

const hemi=new THREE.HemisphereLight(0xdfeaf7,0x6b6258,0.6);scene.add(hemi);

Object.assign(sun.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:80});sun.shadow.bias=-0.0006;scene.add(sun);

/* ---------- realistic city ---------- */
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
function cvs(w,h,draw,srgb){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy?Math.min(8,renderer.capabilities.getMaxAnisotropy()):4;if(srgb!==false)t.encoding=THREE.sRGBEncoding;return t;}

/* facade tile = cols x rows windows; returns colour map + night emissive map */
function facade(kind){const cols=kind==='glass'||kind==='glass2'?4:kind==='res'?3:3,rows=kind==='res'?3:4;const W=256,H=256;const lit=[];
  for(let i=0;i<cols*rows;i++)lit.push(Math.random()<(kind==='res'?0.55:0.42));

    if(kind.startsWith('glass')){x.fillStyle=kind==='glass'?'#56616d':'#4d5d58';x.fillRect(0,0,W,H);

  });

    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const on=lit[k++];if(!on)continue;
      if(kind.startsWith('glass')){x.fillStyle=Math.random()<.5?'#ffe2b0':'#fff4dc';x.fillRect(c*W/cols+4,r*H/rows+5,W/cols-8,H/rows-10);}
      else{const pw=W/cols*0.5,ph=H/rows*0.52;x.fillStyle='#ffcf8a';x.fillRect(c*W/cols+(W/cols-pw)/2,r*H/rows+H/rows*0.2,pw,ph);}}});

const facMats={};Object.entries(FAC).forEach(([k,v])=>{facMats[k]=new THREE.MeshStandardMaterial({map:v.map,emissiveMap:v.em,emissive:new THREE.Color(0xffffff),emissiveIntensity:0,
  roughness:k.startsWith('glass')?0.22:0.85,metalness:k.startsWith('glass')?0.55:0.05,envMapIntensity:1});});
const TILE={glass:[2.2,2.6],glass2:[2.2,2.6],res:[2.0,2.1],com:[2.4,2.4]};

let TOWER_TOP=20;const facGeos={glass:[],glass2:[],res:[],com:[]};const plain={};const addPlain=(g,c)=>(plain[c]=plain[c]||[]).push(g);

function placeTags(){const w=innerWidth,h=innerHeight;const boxes=[];
  ZL.forEach(l=>{V.copy(l.v).project(camera);const ok=V.z<1&&Math.abs(V.x)<1.05&&V.y<0.95&&V.y>-0.55&&!(w<560&&l.d.classList.contains('minor'));
    let x=(V.x+1)/2*w,y=(1-V.y)/2*h;const bw=l.d.offsetWidth||44,bh=l.d.offsetHeight||22;
    for(let k=0;k<4;k++){const hit=boxes.find(b=>Math.abs(b.x-x)<(b.w+bw)/2+4&&Math.abs(b.y-y)<(b.h+bh)/2+2);if(!hit)break;y=hit.y-(hit.h+bh)/2-3;}
    if(ok)boxes.push({x,y,w:bw,h:bh});l.d.style.opacity=ok?1:0;l.d.style.left=x+'px';l.d.style.top=y+'px';});}

/* ---------- UI ---------- */
const slider=document.getElementById('slider'),clock=document.getElementById('clock'),cap=document.getElementById('caption'),playBtn=document.getElementById('play');
let hour=8,playing=true,show={heat:true,trail:true,seg:false},scrubTracked=false;
const CAPS=[[6,'深夜，人流集中在住宅區'],[7.3,'清晨，住宅區開始活動'],[9.4,'早上通勤，人流經捷運站移向辦公區'],[11.4,'上午，辦公區熱度升高'],[13.6,'午餐時段，辦公人流湧入百貨商圈'],[17.6,'下午，辦公區維持熱度，家庭客走向公園'],[19.4,'下班時段，人流分流到百貨商圈、夜生活區與住宅區'],[22.4,'夜間，百貨商圈與夜生活區成為熱點'],[24.01,'深夜，人流回到住宅區']];
let lastCap='';
function setPlay(p){playing=p;playBtn.textContent=p?'❚❚':'▶';playBtn.setAttribute('aria-label',p?'暫停':'播放');}
playBtn.addEventListener('click',()=>{sfx.click();setPlay(!playing);if(playing)track('ailocus_demo_play');});
slider.addEventListener('input',()=>{if(Math.floor(+slider.value)!==Math.floor(hour))sfx.tick();hour=+slider.value;setPlay(false);if(!scrubTracked){scrubTracked=true;track('ailocus_demo_scrub');}});
function chip(id,key){const b=document.getElementById(id);b.addEventListener('click',()=>{sfx.click();show[key]=!show[key];b.setAttribute('aria-pressed',show[key]);
  if(key==='seg')document.getElementById('legend').classList.toggle('on',show.seg);track('ailocus_demo_toggle_'+key);});}
chip('cHeat','heat');chip('cTrail','trail');chip('cSeg','seg');

/* ---------- camera ---------- */
let theta=1.05,phi=0.92,radius=36;const target=new THREE.Vector3(0,0.5,1.5);
const el=renderer.domElement;const pointers=new Map();let pinchD=0,lastInteract=-1e9;
if(!EMBED){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();});
  el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const pr=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(pointers.size===1){theta-=(e.clientX-pr.x)*0.008;phi=Math.min(1.35,Math.max(0.25,phi-(e.clientY-pr.y)*0.006));}
    else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD)radius=Math.min(80,Math.max(12,radius*pinchD/d));pinchD=d;}});
  const up=e=>{pointers.delete(e.pointerId);pinchD=0;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(80,Math.max(12,radius*(1+e.deltaY*0.001)));lastInteract=performance.now();},{passive:false});
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?50:40;
  /* fit the city into the free area between header and bottom panel */
  const panelH=(document.querySelector('.dock')||{}).offsetHeight||0,topH=(document.querySelector('.top')||{}).offsetHeight||0;
  const freeH=Math.max(120,h-panelH-topH);camera.setViewOffset(w,h,0,(panelH-topH)/2,w,h);camera.updateProjectionMatrix();
  const tv=Math.tan(camera.fov*Math.PI/360),th=tv*w/h;
  const dW=30/(2*th),dH=27/(2*tv*freeH/h);
  if(performance.now()-lastInteract>1e6){radius=Math.min(80,Math.max(20,Math.max(dW,dH)));target.set(0,3.8,1.5);}}
addEventListener('resize',resize);resize();setTimeout(resize,600);if(document.fonts)document.fonts.ready.then(resize);

/* ---------- loop ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let visible=true;if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:0.05}).observe(document.body);}
let last=performance.now();const tmp={x:0,z:0,m:false};const PURPLE=new THREE.Color(0x7E3D8E),bgNow=new THREE.Color(),roadDay=new THREE.Color(0xD6CADD),roadNight=new THREE.Color(0x4a3556);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function frame(now){
  if(!visible||document.hidden){if(SND.ctx&&SND.ctx.state==='running')SND.ctx.suspend();last=now;requestAnimationFrame(frame);return;}
  if(SND.on&&SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
  if(playing){hour=(hour+dt*24/42)%24;slider.value=hour.toFixed(2);}
  const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60/15)*15;clock.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const c=CAPS.find(c=>hour<c[0])[1];if(c!==lastCap){lastCap=c;cap.textContent=c;}

  /* day / night */
  const day=ss(5.2,7.2,hour)-ss(17.8,19.6,hour);const night=1-day;
  const dusk=Math.max(0,1-Math.abs(hour-18.6)/1.3)+Math.max(0,1-Math.abs(hour-6.3)/1.1);
  skyU.top.value.copy(SKY.dt).lerp(SKY.nt,night).lerp(SKY.st,dusk*0.35);skyU.bot.value.copy(SKY.db).lerp(SKY.nb,night).lerp(SKY.sb,dusk*0.55);
  scene.fog.color.copy(skyU.bot.value);bgNow.copy(skyU.bot.value);scene.background.copy(skyU.bot.value);
  hemi.intensity=0.18+0.5*day;sun.intensity=0.08+1.15*day;sun.color.setHex(0xfff1dc).lerp(SKY.st,dusk*0.6);
  Object.values(facMats).forEach(m=>m.emissiveIntensity=night*1.4);lampMat.emissiveIntensity=night*6;lanMat.emissiveIntensity=0.3+night*2;
  renderer.toneMappingExposure=0.82+0.12*day;

  /* agents */
  cnt.fill(0);const bgc=bgNow;
  for(let i=0;i<N;i++){const a=agents[i];agentPos(a,hour,tmp);
    const wob=tmp.m?0:0.18;const x=tmp.x+Math.sin(time*0.9+a.ph)*wob,z=tmp.z+Math.cos(time*0.7+a.ph)*wob;
    pPos[i*3]=x;pPos[i*3+1]=0.45;pPos[i*3+2]=z;
    const col=show.seg?SEGCOL[a.seg]:PURPLE;pCol[i*3]=col.r;pCol[i*3+1]=col.g;pCol[i*3+2]=col.b;
    const gx=Math.floor((x+12)/CS),gz=Math.floor((z+12)/CS);if(gx>=0&&gx<G&&gz>=0&&gz<G)cnt[gz*G+gx]+=1;
    for(let g=1;g<=GH;g++){const o=(N+(i*GH)+(g-1))*3;
      if(show.trail&&tmp.m){agentPos(a,hour-g*0.045,tmp);pPos[o]=tmp.x;pPos[o+1]=0.42;pPos[o+2]=tmp.z;tc.copy(col).lerp(bgc,0.25+g*0.13);pCol[o]=tc.r;pCol[o+1]=tc.g;pCol[o+2]=tc.b;agentPos(a,hour,tmp);}
      else{pPos[o]=x;pPos[o+1]=0.45;pPos[o+2]=z;pCol[o]=col.r;pCol[o+1]=col.g;pCol[o+2]=col.b;}}
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
  

  /* heat grid */
  for(let z=0;z<G;z++)for(let x=0;x<G;x++){let s=0,w=0;for(let dz=-1;dz<=1;dz++)for(let dx2=-1;dx2<=1;dx2++){const X=x+dx2,Z=z+dz;if(X<0||Z<0||X>=G||Z>=G)continue;const k=(dx2===0&&dz===0)?1:0.5;s+=cnt[Z*G+X]*k;w+=k;}
    heatT[z*G+x]=Math.min(1,s/w*0.24);}
  const kk=Math.min(1,dt*4);
  for(let i=0;i<G*G;i++){heat[i]+=(heatT[i]-heat[i])*kk;const v=heat[i];const x=-12+(i%G+0.5)*CS,z=-12+(Math.floor(i/G)+0.5)*CS;
    if(!show.heat||v<0.13){dummy.scale.setScalar(0);dummy.position.set(x,0,z);dummy.updateMatrix();pillars.setMatrixAt(i,dummy.matrix);tiles.setMatrixAt(i,dummy.matrix);continue;}
    const hgt=0.2+v*v*6;dummy.position.set(x,hgt/2+0.1,z);dummy.scale.set(0.3+v*0.5,hgt,0.3+v*0.5);dummy.updateMatrix();pillars.setMatrixAt(i,dummy.matrix);pillars.setColorAt(i,heatColor(v,tc));
    dummy.position.set(x,0.16,z);dummy.scale.set(1,1,1);dummy.updateMatrix();tiles.setMatrixAt(i,dummy.matrix);tiles.setColorAt(i,heatColor(v,tc));}
  pillars.instanceMatrix.needsUpdate=true;pillars.instanceColor.needsUpdate=true;tiles.instanceMatrix.needsUpdate=true;tiles.instanceColor.needsUpdate=true;

  /* sound: moving share, zone hot spots, dawn/dusk */
  if(SND.on){let mv=0;for(let i=0;i<N;i+=4){agentPos(agents[i],hour,tmp);if(tmp.m)mv++;}const moving=Math.min(1,mv/(N/4)*2.2);audioUpdate(day,moving);
    ZONES.forEach((z,zi)=>{const cells=zoneCells[zi];let s2=0;cells.forEach(i=>s2+=heat[i]);const a=cells.length?s2/cells.length:0;
      if(!zoneHot[zi]&&a>0.34){zoneHot[zi]=true;sfx.blip(zi);}else if(zoneHot[zi]&&a<0.24)zoneHot[zi]=false;});
    if(prevHour!==null&&playing){const cross=(t)=>prevHour<t&&hour>=t;if(cross(6.2))sfx.dawn();if(cross(18.8))sfx.dusk();}}
  prevHour=hour;
  /* interest pins */
  pins.forEach((p,pi)=>{const on=hour>=p.a&&hour<p.b?1:0;if(on&&p.k<0.1&&!p.was){sfx.pin(pi);}p.was=on===1;p.k+=(on-p.k)*Math.min(1,dt*5);p.s.scale.setScalar(p.k*1.6);p.s.position.y=p.y+Math.sin(time*2.2+p.a)*0.2;});

  if(!reduce&&now-lastInteract>4000&&pointers.size===0)theta+=((1.05+Math.sin(time*0.1)*0.4)-theta)*Math.min(1,dt*0.6);
  camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);renderer.render(scene,camera);placeTags();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
