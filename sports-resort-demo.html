<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
if(EMBED)document.body.classList.add('embed');
const track=(name)=>{try{if(window.gtag)gtag('event',name,{event_category:'playmasters_demo',embed:EMBED?'1':'0'});}catch(e){}};
(function(){const f=document.getElementById('full');const u=new URL(location.href);u.searchParams.delete('embed');f.href=u.pathname+(u.search||'');f.addEventListener('click',()=>track('playmasters_demo_fullscreen'));})();
if(!window.THREE){document.getElementById('err').style.display='flex';return;}

/* ================= sound ================= */
const SND={ctx:null,on:false,last:{}};
function audioInit(){if(SND.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SND.ctx=c;
  SND.master=c.createGain();SND.master.gain.value=0.55;const comp=c.createDynamicsCompressor();SND.master.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate;SND.noise=c.createBuffer(1,len,c.sampleRate);const d=SND.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
function gate(k,ms){const n=performance.now();if(SND.last[k]&&n-SND.last[k]<ms)return false;SND.last[k]=n;return true;}
function tone(f,dur,type,vol,when,to){if(!SND.on)return;const c=SND.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+0.05);}
function noise(dur,f,q,vol,when,to,type){if(!SND.on)return;const c=SND.ctx,t=c.currentTime+(when||0),s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=SND.noise;bp.type=type||'bandpass';bp.frequency.setValueAtTime(f,t);if(to)bp.frequency.exponentialRampToValueAtTime(to,t+dur);bp.Q.value=q;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(SND.master);s.start(t,Math.random()*0.4);s.stop(t+dur+0.05);}
const sfx={
  engine(){noise(2.4,160,0.8,0.12,0,90,'lowpass');tone(70,2.2,'sawtooth',0.03,0,55);},
  honk(){tone(440,0.14,'square',0.05);tone(554,0.18,'square',0.05,0.16);},
  shutter(){if(!gate('sh',120))return;noise(0.05,3000,1,0.2);noise(0.07,1800,1,0.14,0.07);},
  whoosh(){if(!gate('wh',110))return;noise(0.4,500,2.5,0.08,0,3500);},
  heart(){if(!gate('ht',90))return;tone(1500+Math.random()*500,0.16,'triangle',0.05);},
  kick(){tone(150,0.26,'sine',0.45,0,45);},
  clap(){[0,0.012,0.024].forEach(w=>noise(0.12,1500,1.2,0.25,w));},
  coin(){if(!gate('coin',110))return;tone(1318.5,0.12,'square',0.045);tone(1975.5,0.45,'sine',0.11,0.07);},
  swell(){tone(392,1.4,'triangle',0.08);tone(493.9,1.4,'triangle',0.06,0.12);tone(587.3,1.6,'triangle',0.06,0.24);}
};
const sndBtn=document.getElementById('sound');
sndBtn.addEventListener('click',()=>{audioInit();if(!SND.ctx){sndBtn.textContent='不支援音效';return;}if(SND.ctx.state==='suspended')SND.ctx.resume();
  SND.on=!SND.on;sndBtn.setAttribute('aria-pressed',SND.on);sndBtn.textContent=SND.on?'關閉音效':'開啟音效';if(SND.on){sfx.heart();track('playmasters_demo_sound_on');}});

/* ================= renderer ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,0.1,400);
function applyTheme(){const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()||'#FDF6EC';scene.background=new THREE.Color(c);scene.fog=new THREE.Fog(scene.background.clone(),70,140);}
applyTheme();if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
let seed=13;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const grad=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.needsUpdate=true;
const mcache={};const toon=(c,o)=>{if(!o&&mcache[c])return mcache[c];const m=new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},o||{}));if(!o)mcache[c]=m;return m;};
const OUT=new THREE.MeshBasicMaterial({color:0x4a3320,side:THREE.BackSide});
function outline(mesh,s){const o=new THREE.Mesh(mesh.geometry,OUT);o.scale.setScalar(s||1.07);mesh.add(o);return mesh;}
function cast(m){m.castShadow=true;return m;}
function merge(parts){const pos=[],nor=[];parts.forEach(([g,m])=>{const n=g.index?g.toNonIndexed():g.clone();n.applyMatrix4(m);n.computeVertexNormals();pos.push(...n.attributes.position.array);nor.push(...n.attributes.normal.array);});
  const b=new THREE.BufferGeometry();b.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));b.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));return b;}
const GOLD=new THREE.Color(0xEB9520),GOLD_L=new THREE.Color(0xF2B869),WHITE=new THREE.Color(0xffffff),BLUE=new THREE.Color(0x0066CC),SKY=new THREE.Color(0x44A9DE),PINK=new THREE.Color(0xF08FA8);
scene.add(new THREE.HemisphereLight(0xfff6e8,0xe4cfa8,0.5));
const sun=new THREE.DirectionalLight(0xfff4e0,0.62);sun.position.set(-12,26,18);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:80});sun.shadow.bias=-0.0006;scene.add(sun);

/* ================= resort diorama ================= */
const B={};const winParts=[];
const M4=(x,y,z,ry,sx,sy,sz,rx,rz)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),new THREE.Vector3(sx||1,sy||1,sz||1));
const BOX=new THREE.BoxGeometry(1,1,1),SPH=new THREE.SphereGeometry(0.5,14,10),CYL=new THREE.CylinderGeometry(0.5,0.5,1,12),CONE=new THREE.ConeGeometry(0.5,1,10);
const add=(g,m,c)=>(B[c]=B[c]||[]).push([g,m]);
const box=(w,h,d,x,y,z,c)=>add(BOX,M4(x,y+h/2,z,0,w,h,d),c);
/* ground */
box(32,0.7,24,0,-0.7,1.5,0xEEDFC6);
box(31.4,0.05,23.4,0,-0.05,1.5,0xF7EBD8);
box(31.4,0.06,2.6,0,-0.04,8.3,0xB9B2A8);            /* road */
box(31.4,0.08,1.2,0,-0.03,6.5,0xE3D3BA);            /* sidewalk */
for(let i=-7;i<=7;i++)box(1.1,0.07,0.14,i*2.1,-0.03,8.3,0xF7F2EA);
/* plaza */
const plaza=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,0.08,40),toon(0xFFF1DC));plaza.position.set(0,0.02,3.6);plaza.receiveShadow=true;scene.add(plaza);
const plazaRing=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.07,6,60),toon(0xEB9520));plazaRing.rotation.x=Math.PI/2;plazaRing.position.set(0,0.07,3.6);scene.add(plazaRing);
/* hotel */
box(4.4,8.5,4,-9.5,0,-3.2,0xFFF8EE);for(let k=1;k<8.2;k+=0.75)winParts.push([BOX,M4(-9.5,k,-3.2,0,4.46,0.22,4.06)]);
box(3.6,0.6,3.2,-9.5,8.5,-3.2,0xEB9520);box(3.2,0.18,1.4,-9.5,2.4,-0.6,0xEB9520);box(1.6,2.2,0.12,-9.5,0,-1.15,0x6b4a33);
/* restaurant */
box(5.4,2.6,3.4,-2.2,0,-3.6,0xFFE9D6);box(5.6,0.3,3.6,-2.2,2.6,-3.6,0xF2B869);box(1.4,1.9,0.1,-2.2,0,-1.86,0x6b4a33);
for(let i=0;i<5;i++){const c=i%2?0xFFFFFF:0xEB9520;add(BOX,M4(-4.4+i*1.1,2.05,-1.55,0,1.1,0.12,0.9,0.4),c);}
[[-4,-0.5],[-0.4,-0.5]].forEach(([x,z])=>{add(CYL,M4(x,0.45,z,0,0.8,0.08,0.8),0xFFFFFF);add(CYL,M4(x,0.22,z,0,0.08,0.44,0.08),0x8d949c);add(CONE,M4(x,1.6,z,0,1.6,0.5,1.6),0xF08FA8);add(CYL,M4(x,0.9,z,0,0.05,1.3,0.05),0x8d949c);});
winParts.push([BOX,M4(-3.8,1.4,-3.6,0,1.4,0.9,3.46)]);winParts.push([BOX,M4(-0.6,1.4,-3.6,0,1.4,0.9,3.46)]);
/* water park */
box(6.4,0.25,4.4,5.2,0,-3.4,0xFFFFFF);
const pool=new THREE.Mesh(new THREE.BoxGeometry(5.6,0.06,3.6),toon(0x7FD0F0));pool.position.set(5.2,0.28,-3.4);scene.add(pool);
box(1.2,3.4,1.2,8.6,0,-5.3,0xF2B869);box(1.4,0.2,1.4,8.6,3.4,-5.3,0xEB9520);
const slide=new THREE.Mesh(new THREE.TorusGeometry(1.7,0.22,8,24,Math.PI*1.1),toon(0x44A9DE));slide.position.set(7.7,2.0,-4.1);slide.rotation.set(0.2,0.9,-0.6);slide.castShadow=true;scene.add(slide);
[[3,-1.2],[5,-1.2],[7,-1.2]].forEach(([x,z],i)=>{add(CYL,M4(x,0.9,z,0,0.06,1.6,0.06),0x8d949c);add(CONE,M4(x,1.9,z,0,1.5,0.45,1.5),[0xEB9520,0x44A9DE,0xF08FA8][i]);add(BOX,M4(x+0.4,0.35,z-0.1,0,0.5,0.14,1.1),0xFFFFFF);});
/* fashion street */
[[11,0.4,0xF9D9E3],[11,2.6,0xE9F2FF],[11,4.8,0xFFF4C9]].forEach(([x,z,c],i)=>{box(3.4,2.4+i*0.35,2,x,0,z,c);box(0.9,0.12,2.1,x-2.05,1.7,z,[0xEB9520,0x7E3D8E,0x44A9DE][i]);box(0.1,1.5,0.9,x-1.72,0,z,0x6b4a33);
  winParts.push([BOX,M4(x-1.72,1.1,z+0.6,0,0.08,0.7,0.5)]);});
/* palms */
function palm(x,z,s){add(CYL,M4(x,1.3*s,z,0,0.2*s,2.6*s,0.2*s,0.08,0.05),0x9a7048);for(let i=0;i<6;i++){const a=i/6*Math.PI*2;add(BOX,M4(x+Math.cos(a)*0.55*s,2.55*s,z+Math.sin(a)*0.55*s,-a,1.3*s,0.06,0.34*s,0,-0.35),0x6fae5c);}}
[[-14,-1],[-13.5,4],[-5.8,0.6],[1.3,-0.6],[13.8,-2.5],[14,6.2],[-5,5.6],[5.2,5.6]].forEach(([x,z],i)=>palm(x,z,0.9+(i%3)*0.12));
Object.entries(B).forEach(([c,p])=>{const m=new THREE.Mesh(merge(p),toon(+c));m.castShadow=true;m.receiveShadow=true;scene.add(m);});
const winMat=toon(0xCFE3F2,{emissive:new THREE.Color(0xFFD27A),emissiveIntensity:0});scene.add(new THREE.Mesh(merge(winParts),winMat));
/* venue glow rings (pulse when fans arrive) */
const VENUES={hotel:{door:{x:-9.5,z:-0.6},c:[-9.5,0,-3.2]},food:{door:{x:-2.2,z:-1.2},c:[-2.2,0,-3.6]},water:{door:{x:4,z:-0.9},c:[5.2,0,-3.4]},street:{door:{x:9.1,z:2.6},c:[11,0,2.6]}};
Object.values(VENUES).forEach(v=>{const r=new THREE.Mesh(new THREE.RingGeometry(0.9,1.15,40),new THREE.MeshBasicMaterial({color:0xEB9520,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  r.rotation.x=-Math.PI/2;r.position.set(v.door.x,0.08,v.door.z+0.3);scene.add(r);v.ring=r;v.pulse=0;});

/* content wall */
const wall=new THREE.Group();wall.position.set(0,0,0.3);scene.add(wall);
wall.add(cast(outline(new THREE.Mesh(new THREE.BoxGeometry(6.2,3.6,0.3),toon(0xFFFFFF)),1.02)));wall.children[0].position.y=2.3;

  {d:mkTag('服飾贊助','sp'),p:()=>M2.set(girls[4].root.position.x+0.6,2.6,girls[4].root.position.z),a:T_OUT+0.6,b:()=>S2+1.6},
  {d:mkTag('運動女孩','brand'),p:()=>M2.set(girls[2].root.position.x,2.9,girls[2].root.position.z),a:()=>S2+1.6,b:1e9},
  {d:mkTag('內容素材牆'),p:()=>M2.set(0,5,0.3),a:()=>S2,b:1e9},
  {d:mkTag('官方帳號','brand'),p:()=>M2.set(0,15.3,-6),a:()=>S3,b:1e9},
  {d:mkTag('女孩個人帳號'),p:()=>M2.set(7.5,13.7,-5.5),a:()=>S3,b:1e9}];
const M2=new THREE.Vector3();const val=v=>typeof v==='function'?v():v;
function placeTags(t){const w=innerWidth,h=innerHeight;const boxes=[];
  tagDefs.forEach(l=>{const v=l.p().project(camera);const ok=v.z<1&&Math.abs(v.x)<1.05&&v.y<0.95&&v.y>-0.6&&t>=val(l.a)&&t<val(l.b);
    let x=(v.x+1)/2*w,y=(1-v.y)/2*h;const bw=l.d.offsetWidth||50,bh=l.d.offsetHeight||22;
    if(ok){for(let k=0;k<4;k++){const hit=boxes.find(b=>Math.abs(b.x-x)<(b.w+bw)/2+4&&Math.abs(b.y-y)<(b.h+bh)/2+2);if(!hit)break;y=hit.y-(hit.h+bh)/2-3;}boxes.push({x,y,w:bw,h:bh});}
    l.d.style.opacity=ok?1:0;l.d.style.left=x+'px';l.d.style.top=y+'px';});}

/* ================= camera ================= */
let theta=1.36,phi=1.0,radius=40;const target=new THREE.Vector3(0,3.6,0.5);
const el=renderer.domElement;const pointers=new Map();let pinchD=0,lastInteract=-1e9;
if(!EMBED){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();});
  el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const pr=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(pointers.size===1){theta-=(e.clientX-pr.x)*0.008;phi=Math.min(1.4,Math.max(0.3,phi-(e.clientY-pr.y)*0.006));}
    else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchD)radius=Math.min(90,Math.max(10,radius*pinchD/d));pinchD=d;}});
  const up=e=>{pointers.delete(e.pointerId);pinchD=0;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.min(90,Math.max(10,radius*(1+e.deltaY*0.001)));lastInteract=performance.now();},{passive:false});
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?50:40;
  const panelH=(document.querySelector('.dock')||{}).offsetHeight||0,topH=(document.querySelector('.top')||{}).offsetHeight||0;
  const freeH=Math.max(120,h-panelH-topH);camera.setViewOffset(w,h,0,(panelH-topH)/2,w,h);camera.updateProjectionMatrix();
  const tv=Math.tan(camera.fov*Math.PI/360),th=tv*w/h;const dW=33/(2*th),dH=27/(2*tv*freeH/h);
  if(performance.now()-lastInteract>1e6)radius=Math.min(90,Math.max(20,Math.max(dW,dH)));}
addEventListener('resize',resize);resize();setTimeout(resize,600);if(document.fonts)document.fonts.ready.then(resize);

/* ================= loop ================= */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let visible=true;if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:0.05}).observe(document.body);}
let simT=0,last=performance.now(),lastBeat=-1,engineDone=false,honkDone=false;schedule();
document.getElementById('replay').addEventListener('click',()=>{track('playmasters_demo_replay');simT=0;prevT=0;curStep=-1;engineDone=honkDone=false;follList.length=0;schedule();});
const BPM=2.2;
function danceCheer(c,j,t,time,dt,active,beatBase){
  const beat=Math.max(0,(t-beatBase)*BPM+j*0.08);const bi=Math.floor(beat),ph=beat-bi,hit=Math.sin(ph*Math.PI);
  let lt=[0.25,0.25],kick=[0,0],jump=0;
  if(active){const pat=Math.floor(beat/8)%3;
    if(pat===0){lt=bi%2===0?[2.6,2.6]:[0.9,0.9];}else if(pat===1){lt=[2.85,2.85];jump=hit*0.32;}else{const s=bi%2;lt=s?[2.7,0.6]:[0.6,2.7];kick[s]=hit*1.1;}}
  const k=Math.min(1,dt*14);c.lift[0]+=(lt[0]-c.lift[0])*k;c.lift[1]+=(lt[1]-c.lift[1])*k;c.kick[0]+=(kick[0]-c.kick[0])*k;c.kick[1]+=(kick[1]-c.kick[1])*k;
  c.arms[0].rotation.z=-c.lift[0];c.arms[1].rotation.z=c.lift[1];const sh=active?Math.sin(time*18)*0.12:0;c.arms[0].rotation.x=sh;c.arms[1].rotation.x=-sh;
  c.legs[0].rotation.x=-c.kick[0];c.legs[1].rotation.x=-c.kick[1];c.jump=jump;c.head.rotation.z=active?Math.sin(beat*Math.PI)*0.12:0;
  c.tails.forEach((tp,i)=>{tp.rotation.x=0.25+Math.sin(time*7+i)*0.15+jump*0.8;tp.rotation.z=Math.sin(time*5+i*2)*0.18;});}
function walkCheer(c,j,time,dt){const s=Math.sin(time*9+j)*0.55;c.legs[0].rotation.x=s;c.legs[1].rotation.x=-s;const k=Math.min(1,dt*10);
  c.lift[0]+=(0.3-c.lift[0])*k;c.lift[1]+=(0.3-c.lift[1])*k;c.arms[0].rotation.z=-c.lift[0];c.arms[1].rotation.z=c.lift[1];c.arms[0].rotation.x=-s*0.6;c.arms[1].rotation.x=s*0.6;c.jump=Math.abs(Math.sin(time*9+j))*0.06;
  c.tails.forEach((tp,i)=>{tp.rotation.x=0.35+Math.sin(time*9+i)*0.12;tp.rotation.z=0;});}
const lerpA=(a,b,k)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;};

function frame(now){
  if(!visible||document.hidden){if(SND.ctx&&SND.ctx.state==='running')SND.ctx.suspend();last=now;requestAnimationFrame(frame);return;}
  if(SND.on&&SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();
  const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;simT+=dt;let t=simT;
  if(t>END+1.2){simT=0;t=0;prevT=0;curStep=-1;engineDone=honkDone=false;follList.length=0;schedule();}
  setStep(t<S2?0:t<S3?1:t<S4?2:3);
  const crossed=x=>prevT<x&&t>=x;

  /* van */
  let vx;if(t<T_VAN){const u=t/T_VAN;vx=-20+(DROP.x-0.5+20)*(1-(1-u)*(1-u));}else if(t<S2+0.8)vx=DROP.x-0.5;else vx=DROP.x-0.5+(t-S2-0.8)*(t-S2-0.8)*3.2;
  van.position.set(vx,0,8.0);van.visible=vx<18;if(crossed(0.05))sfx.engine&&SND.on&&sfx.engine();if(crossed(T_VAN)&&SND.on)sfx.honk();

  /* girls */
  const L=leader(t);const out=t>=T_OUT;const stop=L.stop;const stopActive=stop&&t>=stop.t0+0.2;
  const finalStop=stop&&stop.i===STOPS.length-1;
  girls.forEach((c,j)=>{const appear=t>=T_OUT+j*0.12;c.root.visible=appear;if(!appear)return;
    const f=FORM[j];let fx,fz,face;
    if(t<T_GO){fx=DROP.x+f[0]*0.8+1;fz=DROP.z+0.5+f[1];face=0;}
    else{const hd=stop?stop.s.face:L.face;const ca=Math.cos(hd),sa=Math.sin(hd);
      const ox=stop?f[0]:f[0]*0.55,oz=stop?f[1]:f[1]-Math.abs(f[0])*0.4;
      fx=L.x+ox*ca+oz*sa;fz=L.z-ox*sa+oz*ca;face=hd;}
    c.pos=c.pos||{x:fx,z:fz};c.pos.x+=(fx-c.pos.x)*Math.min(1,dt*6);c.pos.z+=(fz-c.pos.z)*Math.min(1,dt*6);
    c.root.rotation.y=lerpA(c.root.rotation.y,face,Math.min(1,dt*8));
    const pop=Math.min(1,(t-T_OUT-j*0.12)*4);
    if(L.walk&&!stop&&t>=T_GO)walkCheer(c,j,time,dt);else danceCheer(c,j,t,time,dt,!!stopActive,stop?stop.t0:0);
    c.root.position.set(c.pos.x,0.05+(c.jump||0),c.pos.z);c.root.scale.setScalar(0.8*pop);
    const cs=cases[j];cs.visible=t>=T_OUT&&t<S2;if(cs.visible){cs.position.set(c.pos.x+0.42*Math.cos(c.root.rotation.y),0,c.pos.z-0.42*Math.sin(c.root.rotation.y));cs.rotation.y=c.root.rotation.y;}
  });
  /* beat */
  if(stopActive){const beat=Math.floor((t-stop.t0)*BPM);if(beat!==lastBeat){lastBeat=beat;const m=beat%4;if(SND.on){if(m===0||m===1)sfx.kick();if(m===2)sfx.clap();}}}else lastBeat=-1;
  if(finalStop&&stopActive){pomGold.emissiveIntensity=pomWhite.emissiveIntensity=0.35;}else pomGold.emissiveIntensity=pomWhite.emissiveIntensity=stopActive?0.25:0;

  /* content cards -> wall */
  let ci=0;
  cardsFly.forEach(cf=>{const u=(t-cf.t0)/cf.dur;if(crossed(cf.t0)&&cf.flash){flashT=t;flash.position.copy(cf.from);if(SND.on)sfx.shutter();}
    if(crossed(cf.t0+cf.dur)){tiles[cf.slot].on=true;tiles[cf.slot].pop=t;if(SND.on)sfx.whoosh();}
    if(u>=0&&u<1&&ci<cardSprites.length){const s=cardSprites[ci++];s.visible=true;s.material.map=cf.tex;bez(P,cf.from,SLOTS[cf.slot],2.2,u);s.position.copy(P);s.scale.set(0.8,0.95,1);}});
  for(let i=ci;i<cardSprites.length;i++)cardSprites[i].visible=false;
  const fa=t-flashT;flash.material.opacity=fa>=0&&fa<0.35?0.7*(1-fa/0.35):0;flash.scale.setScalar(0.5+Math.max(0,fa)*6);
  tiles.forEach(tl=>{const k=tl.on?Math.min(1,(t-tl.pop)*5):0;tl.m.scale.setScalar(Math.max(0.001,k));});

  /* phones */
  const ph=t>=S3-0.4?Math.min(1,(t-S3+0.4)*2.5):0;
  [OFFICIAL,...personal].forEach((g,i)=>{g.visible=ph>0;g.scale.setScalar(Math.max(0.001,ph*(1+Math.sin(time*1.6+i)*0.02)));g.position.y=(i===0?13.2:PPOS[i-1][1])+Math.sin(time*1.2+i)*0.15;g.lookAt(camera.position.x,g.position.y,camera.position.z);});

  /* particles (card flights, re-shares, fans) */
  let n=0;
  for(const p of parts){const u=(t-p.t0)/p.dur,end=p.t0+p.dur;
    if(prevT<end&&t>=end){if(p.card||p.tgt!==undefined){if(p.tgt===-1){spawnHeart(OFFICIAL.position,t,false);addFollowers(-1,2);}else if(p.tgt>=0){for(let k=0;k<2;k++)spawnHeart(personal[p.tgt].position,t+k*0.1,true);addFollowers(p.tgt,5);}if(SND.on)sfx.heart();}}
    if(u<0||u>=1||n>=POOL)continue;bez(P,p.from,p.to,p.h,u);dummy.position.copy(P);dummy.rotation.set(0,0,0);dummy.scale.setScalar(p.card?1.5:1);dummy.updateMatrix();partMesh.setMatrixAt(n,dummy.matrix);partMesh.setColorAt(n,p.c);n++;}
  for(let i=n;i<POOL;i++){dummy.scale.setScalar(0);dummy.updateMatrix();partMesh.setMatrixAt(i,dummy.matrix);}
  partMesh.instanceMatrix.needsUpdate=true;partMesh.instanceColor.needsUpdate=true;

  /* followers orbiting phones */
  follList.forEach((f,i)=>{const g=f.k<0?OFFICIAL:personal[f.k];const a=f.a+time*0.25*(f.k<0?1:1.3);const age=time-f.born;const s=Math.min(1,age*3);
    dummy.position.set(g.position.x+Math.cos(a)*f.r,g.position.y+f.y*0.6,g.position.z+Math.sin(a)*f.r*0.5);dummy.scale.setScalar(ph?s:0);dummy.updateMatrix();follMesh.setMatrixAt(i,dummy.matrix);follMesh.setColorAt(i,f.c);});
  for(let i=follList.length;i<260;i++){dummy.scale.setScalar(0);dummy.updateMatrix();follMesh.setMatrixAt(i,dummy.matrix);}
  follMesh.instanceMatrix.needsUpdate=true;follMesh.instanceColor.needsUpdate=true;

  hearts.forEach(h=>{const a=t-h.t0;if(a<0||a>1.4){h.s.visible=false;return;}h.s.visible=true;h.s.position.set(h.p.x+h.dx*a,h.p.y+1.4+a*1.8,h.p.z+0.2);h.s.material.opacity=1-a/1.4;h.s.scale.setScalar((h.big?0.9:0.6)*(0.6+Math.min(a*3,1)*0.4));});

  /* fans walk into venues */
  fans.forEach((f,i)=>{if(f.mode==='hidden'&&t>=f.spawnAt&&f.spawnAt<1e8){f.mode='go';f.x=f.sx;f.z=f.sz;f.face=0;f.g.visible=true;}
    if(f.mode==='go'){if(moveTo(f,f.door.door.x+(i%3-1)*0.35,f.door.door.z,2.6,dt)){f.mode='in';f.g.visible=false;f.door.pulse=t;if(SND.on)sfx.coin();}
      f.g.position.set(f.x,0,f.z);f.g.rotation.y=f.face;const s=Math.sin(time*9+i)*0.6;f.legs[0].rotation.x=s;f.legs[1].rotation.x=-s;}});
  Object.values(VENUES).forEach(v=>{const a=t-v.pulse;v.ring.material.opacity=a>=0&&a<1?0.8*(1-a):0;v.ring.scale.setScalar(1+Math.max(0,a)*1.2);});
  winMat.emissiveIntensity=t>=S4?0.35+Math.sin(time*3)*0.1:0;

  prevT=t;
  if(!reduce&&now-lastInteract>4000&&pointers.size===0)theta+=((1.36+Math.sin(time*0.1)*0.3)-theta)*Math.min(1,dt*0.6);
  camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);renderer.render(scene,camera);placeTags(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
