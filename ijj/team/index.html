<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var u8=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var err=document.getElementById('err');err.textContent='';
    try{
      var pw=document.getElementById('pw').value;
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.data));
      var url=URL.createObjectURL(new Blob([plain],{type:'image/png'}));
      document.getElementById('img').src=url;document.getElementById('dl').href=url;
      document.getElementById('gate').style.display='none';document.getElementById('view').style.display='block';
    }catch(x){err.textContent='密碼錯誤';}
  });
})();
</script>
