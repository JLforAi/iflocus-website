<style>
:root{--ink:#10141c;--line:#dfe4ea;--water:#0e7490;--warn:#b91c1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#10141c;color:#fff;padding:24px;
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.gate{width:100%;max-width:390px}
.mark{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:#7d8fa3;margin:0 0 14px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:27px;line-height:1.3;margin:0 0 8px}
.lede{font-size:13.5px;line-height:1.75;color:#9fb0c2;margin:0 0 26px}

  text-transform:uppercase;color:#7d8fa3;margin-bottom:7px}
input{width:100%;padding:13px 14px;font-size:16px;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:9px}
input:focus{outline:2px solid var(--water);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;
  color:#10141c;background:#fff;border:0;border-radius:9px;cursor:pointer}
button:hover{background:#e6ebf1}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:20px;margin:12px 0 0;font-size:13px;color:#ff8f8f}
.msg.busy{color:#9fb0c2}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);
  font-size:11.5px;line-height:1.7;color:#6d7e91}
.bar{height:3px;background:linear-gradient(90deg,#b45309 0 25%,#0e7490 25% 50%,#4f46e5 50% 75%,#be185d 75% 100%);
  border-radius:2px;margin-bottom:24px}

function b2a(b64){var s=atob(b64),u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}

var msg=document.getElementById('msg'),pw=document.getElementById('pw'),go=document.getElementById('go');

async function open_(pass){
  if(!pass){msg.className='msg';msg.textContent='請輸入密碼。';return;}
  if(!window.crypto||!window.crypto.subtle){
    msg.className='msg';msg.textContent='這個瀏覽器無法解密，請改用 Chrome / Safari，並確認網址是 https。';return;}
  go.disabled=true;msg.className='msg busy';msg.textContent='解密中，請稍候…';
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b2a(DATA.s),iterations:DATA.n,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(DATA.i)},key,b2a(DATA.c));
    var html=new TextDecoder().decode(plain);
    try{sessionStorage.setItem('gm_pw',pass);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;msg.className='msg';msg.textContent='密碼錯誤，請再試一次。';
    pw.value='';pw.focus();
  }
}

go.addEventListener('click',function(){open_(pw.value)});
pw.addEventListener('keydown',function(e){if(e.key==='Enter')open_(pw.value)});
try{var saved=sessionStorage.getItem('gm_pw');if(saved)open_(saved);else pw.focus();}catch(e){pw.focus();}
</script>
